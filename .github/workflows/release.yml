name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Verify files
        run: |
          echo "=== Project Structure ===" && ls -la
          echo "" && echo "=== extension.js lines ===" && wc -l extension.js
          echo "" && echo "=== package.json ===" && cat package.json | head -20
          
      - name: Package extension
        run: npm run package
        
      - name: List artifacts
        run: ls -la *.vsix 2>/dev/null || echo "No VSIX generated"
        
      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: success()
        with:
          files: *.vsix
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
